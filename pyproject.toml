[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bug-triage-env"
version = "1.0.0"
description = "OpenEnv-compliant bug triage benchmark environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "groq>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "app:app"

[tool.openenv]
name = "bug-triage-env"
version = "1.0.0"
entry_point = "environment:BugTriageEnvironment"